name: Bug report
description: Something broke, looked wrong, or didn't do what you expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How did you get there?
      description: What you were doing just before. Screenshots or a short video help a lot (paste them in).
  - type: input
    id: build
    attributes:
      label: Build
      description: Filled in for you when you use Report a bug in the game's menu.
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Windows laptop, Chrome / iPad, Safari
