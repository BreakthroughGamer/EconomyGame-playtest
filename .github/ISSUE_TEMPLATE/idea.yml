name: Idea or feedback
description: Something that would make the game better, or how it felt to play
labels: [feedback]
body:
  - type: textarea
    id: idea
    attributes:
      label: What's your idea or feedback?
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: Filled in for you when you use the link in the game's menu.
